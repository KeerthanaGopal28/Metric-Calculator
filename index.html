<!DOCTYPE html>
<html>
    <head>
        <title>Metric</title>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka&family=Happy+Monkey&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="main">
            <div id="first">
              <h1>Metric/Imperial Unit Conversion</h1>
               <input type="number" id="input-el">
               <button id="btn">Convert</button>
            </div>
            <div id="second">
                <div class="sub">
                  <h2>Lenght(Meter/Feet)</h2>
                  <p id="len"></p>
                </div>
            <div class="sub">
                <h2>Volume (Liters/Gallons)</h2>
                <p id="vol"></p>
            </div>
            <div class="sub">
                <h2>Mass (Kilogram/Pounds)</h2>
                <p id="mass"></p>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
